# This is a plain static site with nothing to compile, so the build is pinned
# explicitly rather than left to Netlify's framework detection. (It used to
# guess Jekyll from a _config.yml in the root and fail on every deploy for want
# of a Gemfile; that file is gone, but pinning the build keeps it from guessing
# wrong again.)
#
# The copy below is what keeps the retired pages and the stale screenshots out
# of the published site.

[build]
  publish = "_site"
  command = "mkdir -p _site && tar --exclude=./.git --exclude=./.github --exclude=./_site --exclude=./Preview --exclude=./archive --exclude=./netlify.toml --exclude=./desktop.ini --exclude=./.gitignore --exclude='./images/PNW cars' --exclude='./images/*.zip' -cf - . | tar -xf - -C _site"

# Hashed filenames aren't in play here — the CSS and JS carry ?v= query strings
# instead — so let HTML revalidate every time and only cache the assets.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
